{{define "content"}}
<div class="form-page">
    <h2>⚙️ Admin Panel</h2>
    <p style="color:var(--text-muted); margin-bottom:1.5rem">
        Manage user roles. You cannot change your own role.
    </p>

    <div class="admin-table-wrapper">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {{range .Users}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Username}}</td>
                    <td>{{.Email}}</td>
                    <td>
                        <span class="role-badge role-{{.Role}}">{{.Role}}</span>
                    </td>
                    <td>
                        {{if ne .ID $.UserID}}
                        <form action="/admin/set-role" method="POST"
                              style="display:flex; gap:0.5rem; align-items:center">
                            <input type="hidden" name="user_id" value="{{.ID}}">
                            <select name="role" class="role-select">
                                <option value="user"
                                    {{if eq .Role "user"}}selected{{end}}>user</option>
                                <option value="moderator"
                                    {{if eq .Role "moderator"}}selected{{end}}>moderator</option>
                                <option value="admin"
                                    {{if eq .Role "admin"}}selected{{end}}>admin</option>
                            </select>
                            <button type="submit" class="btn btn-primary"
                                    style="padding:0.3rem 0.7rem; font-size:0.8rem">
                                Save
                            </button>
                        </form>
                        {{else}}
                        <span style="color:var(--text-muted); font-size:0.82rem">
                            (you)
                        </span>
                        {{end}}
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>
{{end}}
