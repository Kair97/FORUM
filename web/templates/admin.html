{{define "content"}}

<div class="page-header">
    <p class="page-mono-label">// admin panel</p>
    <h1 class="page-title">User Management</h1>
    <p class="page-subtitle">Manage user roles. You cannot change your own role.</p>
</div>

<div class="table-card">
    <div class="table-responsive">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {{range .Users}}
                <tr>
                    <td class="mono">{{.ID}}</td>
                    <td>
                        <span class="mono">@{{.Username}}</span>
                    </td>
                    <td style="color:var(--ink-3);">{{.Email}}</td>
                    <td>
                        <span class="role-badge role-{{.Role}}">{{.Role}}</span>
                    </td>
                    <td>
                        {{if ne .ID $.UserID}}
                        <form action="/admin/set-role" method="POST" class="inline-form">
                            <input type="hidden" name="user_id" value="{{.ID}}">
                            <select name="role" class="inline-select">
                                <option value="user"      {{if eq .Role "user"}}selected{{end}}>user</option>
                                <option value="moderator" {{if eq .Role "moderator"}}selected{{end}}>moderator</option>
                                <option value="admin"     {{if eq .Role "admin"}}selected{{end}}>admin</option>
                            </select>
                            <button type="submit" class="btn btn-primary btn-sm">save</button>
                        </form>
                        {{else}}
                        <span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--ink-4);">
                            (you)
                        </span>
                        {{end}}
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>

{{end}}
