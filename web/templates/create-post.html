 {{define "content"}}

 <div class="form-page">
    <h2>Create New Post</h2>

    {{if .Error}}
    <div class="error-banner">{{.Error}}</div>
    {{end}}

    <form action="/post/create" method="POST" class="post-form" enctype="multipart/form-data">


        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Post Title" required>
        </div>

        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" placeholder="Write your post..." rows="8" required></textarea>
        </div>
        
        <div class="form-group">
            <label>Categories (select at least one)</label>
            <div class="category-checkboxes">
                {{range .Categories}}
                <label class="checkbox-label">
                    <input type="checkbox"
                    name="category_ids"
                    value="{{.ID}}">
                    {{.Name}}
                </label>
                {{end}}
            </div>
        </div>

        <div class="form-group">
            <label for="image">Image (optional - JPEG, PNG, GIF, WebP - max 10MB)</label>
            <div class="file-input-wrapper">
                <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/gif,image/webp" class="file-input">
                <label for="image" class="file-label">📎 Choose image</label>
                <span class="file-name" id="file-name">No file chosen</span>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Publish Post</button>
    </form>

 </div>

 <script>
    document.getElementById('image').addEventListener('change', function() {
        const name = this.files[0] ? this.files[0].name : 'No file chosen';
        document.getElementById('file-name').textContent = name
    });
 </script>

 {{end}}
