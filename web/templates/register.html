{{define "content"}}

<div class="auth-page">
    <div class="auth-card">
        <h2>Create Account</h2>

        {{if .Error}}
        <div class="error-banner">{{.Error}}</div>
        {{end}}

        <form action="/register" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose your username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="*****" required>
            </div>

            <button class="btn btn-primary" type="submit">Create Account</button>
            
        </form>

        <p class="auth-switch">Already have an account? <a href="/login">Login</a></p>

    </div>
</div>

{{end}}
