{{define "base.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons (icon fonts only — no CSS framework) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- ── Site Header ── -->
<header class="site-header">
    <div class="header-inner">

        <a href="/" class="brand">Forum</a>

        <nav class="header-nav" id="header-nav">
            <a href="/" class="nav-link">feed</a>
            {{if .LoggedIn}}
            <a href="/?filter=created" class="nav-link">my posts</a>
            {{end}}
            {{if eq .Role "admin"}}
            <a href="/admin" class="nav-link">admin</a>
            {{end}}
        </nav>

        <div class="header-actions">
            {{if .LoggedIn}}
            <span class="header-user">@{{.Username}}</span>
            <a href="/post/create" class="btn btn-primary btn-sm">+ new post</a>
            <form action="/logout" method="POST" style="display:inline;">
                <button type="submit" class="btn btn-ghost btn-sm">logout</button>
            </form>
            {{else}}
            <a href="/login"    class="btn btn-secondary btn-sm">login</a>
            <a href="/register" class="btn btn-primary btn-sm">register</a>
            {{end}}
        </div>

        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
            <i class="bi bi-list"></i>
        </button>

    </div>
</header>

<!-- ── Page Content ── -->
<main class="main-content">
    <div class="container">
        {{block "content" .}}{{end}}
    </div>
</main>

<!-- ── Footer ── -->
<footer class="site-footer">
    // Forum &middot; built with go &amp; love
</footer>

<script>
    (function() {
        var toggle = document.getElementById('menu-toggle');
        var nav    = document.getElementById('header-nav');
        if (toggle && nav) {
            toggle.addEventListener('click', function() {
                nav.classList.toggle('open');
            });
        }
    })();

    // AJAX voting — no page jump
    document.addEventListener('submit', function(e) {
        var form = e.target;
        if (form.getAttribute('action') !== '/like') return;
        e.preventDefault();

        var parent = form.parentElement;
        var forms = parent.querySelectorAll('form[action="/like"]');
        if (forms.length < 2) return;

        var likeForm = null, dislikeForm = null;
        forms.forEach(function(f) {
            var val = f.querySelector('[name="is_like"]').value;
            if (val === '1') likeForm = f;
            else dislikeForm = f;
        });
        if (!likeForm || !dislikeForm) return;

        var isLike    = form === likeForm;
        var clickedBtn = form.querySelector('button');
        var otherBtn   = (isLike ? dislikeForm : likeForm).querySelector('button');
        var clickedSpan = clickedBtn.querySelector('.vote-count');
        var otherSpan   = otherBtn ? otherBtn.querySelector('.vote-count') : null;

        var clickedCount = parseInt(clickedSpan.textContent) || 0;
        var otherCount   = otherSpan ? (parseInt(otherSpan.textContent) || 0) : 0;
        var wasVoted      = clickedBtn.classList.contains('voted');
        var otherWasVoted = otherBtn && otherBtn.classList.contains('voted');

        if (wasVoted) {
            clickedBtn.classList.remove('voted');
            clickedSpan.textContent = clickedCount - 1;
        } else {
            clickedBtn.classList.add('voted');
            clickedSpan.textContent = clickedCount + 1;
            if (otherWasVoted && otherSpan) {
                otherBtn.classList.remove('voted');
                otherSpan.textContent = otherCount - 1;
            }
        }

        fetch('/like', {
            method: 'POST',
            body: new FormData(form),
            redirect: 'manual'
        }).catch(function() { location.reload(); });
    });
</script>

</body>
</html>
{{end}}
